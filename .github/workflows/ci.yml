name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Smoke
        run: |
          out=$(./formula-vm --file samples/demo.fvm)
          test -n "$out"
